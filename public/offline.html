<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#032553">
<title>オフラインです</title>
<style>
  :root { --bg: #f1f5f9; --card: #ffffff; --fg: #1e293b; --sub: #475569; --line: #e2e8f0; --accent: #0369a1; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #1e293b; --fg: #f1f5f9; --sub: #cbd5e1; --line: #334155; --accent: #38bdf8; --accent-fg: #0f172a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    font-size: 14px; line-height: 1.7;
  }
  main { width: 100%; max-width: 420px; padding: 28px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  h1 { margin: 0 0 8px; font-size: 18px; }
  p { margin: 0 0 12px; color: var(--sub); }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>オフラインです</h1>
  <p>インターネットに接続できません。このアプリは、通信できる場所で使います。</p>
  <p>入力した内容は、通信できるまで保存されません。電波のある場所で、もう一度やり直してください。</p>
  <button type="button" id="retry">もう一度読み込む</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
</script>
</body>
</html>
